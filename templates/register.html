{% extends "base.html" %}

{% block title %}Register - Quiz Master{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">📝</div>
                <h2 class="fw-bold mt-2">Create Account</h2>
                <p class="text-muted">Join as a teacher or student</p>
            </div>

            <form method="POST">
                <!-- Role Selection -->
                <div class="mb-4">
                    <label class="form-label"><i class="fas fa-user-tag me-1 text-primary"></i> I am a... *</label>
                    <div class="row g-3">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="role_teacher" value="teacher" 
                                   {% if role == 'teacher' %}checked{% endif %}>
                            <label class="btn btn-outline-primary w-100 py-3" for="role_teacher">
                                <i class="fas fa-chalkboard-teacher me-2"></i> Teacher
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="role_student" value="student"
                                   {% if role != 'teacher' %}checked{% endif %}>
                            <label class="btn btn-outline-primary w-100 py-3" for="role_student">
                                <i class="fas fa-user-graduate me-2"></i> Student
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label"><i class="fas fa-user me-1 text-primary"></i> Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username or '' }}" placeholder="Choose a username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label"><i class="fas fa-envelope me-1 text-primary"></i> Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email or '' }}" placeholder="your@email.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label"><i class="fas fa-lock me-1 text-primary"></i> Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Minimum 6 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label"><i class="fas fa-lock me-1 text-primary"></i> Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3">
                    <i class="fas fa-user-plus me-1"></i> Create Account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login here</a>
            </p>
        </div>
    </div>
{% endblock %}
